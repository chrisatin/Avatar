services:
  avatar:
    build: .
    image: avatar-pipeline:cu121
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      # Only mount the licensed FLAME drop-in. The redistributable models are
      # baked into the image; mounting all of ./assets/models would hide them
      # on a fresh clone where that directory is empty.
      - ./assets/models/flame:/app/assets/models/flame
      - ./assets/samples:/app/assets/samples
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video
      - AVATAR_FORCE_CPU=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
